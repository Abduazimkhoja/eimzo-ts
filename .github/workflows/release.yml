# Публикация в npm по тегу: npm version patch && git push --follow-tags
#
# Авторизация: Trusted Publishing (OIDC, без токена) — настраивается на npmjs.com
# в Settings пакета → Trusted Publisher: GitHub Actions, workflow `release.yml`.
# Секрет NPM_TOKEN нужен только для первой публикации, пока пакета ещё нет в npm.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # OIDC для Trusted Publishing и provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing требует npm 11.5.1+, в Node 22 встроен npm 10.
      - run: npm install -g npm@latest
      - name: Tag matches package.json version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
